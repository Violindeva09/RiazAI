# RiazAI Backend Configuration
spring.application.name=riazai

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson serialization
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-null-map-values=false

# Server port (ensure it matches React frontend's API_BASE_URL)
server.port=8080

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false
